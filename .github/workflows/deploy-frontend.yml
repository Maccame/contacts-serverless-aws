name: Deploy frontend

# Se déclenche à chaque push sur main qui modifie frontend/, ou manuellement
on:
  push:
    branches: [main]
    paths: ["frontend/**"]
  workflow_dispatch:

# id-token: write est nécessaire pour l'authentification OIDC auprès d'AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Se connecter à AWS (OIDC, sans clé d'accès)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Envoyer les fichiers dans S3
        run: aws s3 sync frontend/ "s3://${{ vars.S3_BUCKET }}/" --delete

      - name: Invalider le cache CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/*"
