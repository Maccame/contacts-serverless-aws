<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>Carnet de contacts</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Ccircle cx='16' cy='12.5' r='5' fill='white'/%3E%3Cpath d='M7 26c1.5-5 5-7 9-7s7.5 2 9 7' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f4f5fb;
      --bg-grad: radial-gradient(1200px 500px at 10% -10%, #e0e7ff 0%, transparent 60%),
                 radial-gradient(900px 400px at 110% 0%, #fce7f3 0%, transparent 55%);
      --surface: #ffffff;
      --surface-2: #f7f8fc;
      --text: #161a2b;
      --muted: #6b7088;
      --border: #e6e8f0;
      --accent: #4f46e5;
      --accent-2: #7c3aed;
      --accent-soft: #eef0ff;
      --danger: #e11d48;
      --danger-soft: #fff1f3;
      --success: #059669;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -8px rgba(16, 24, 40, .10);
      --shadow-lg: 0 24px 48px -12px rgba(16, 24, 40, .25);
      --radius: 16px;
      --radius-sm: 10px;
      --avatar-l: 92%;
      --avatar-text-l: 34%;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e17;
        --bg-grad: radial-gradient(1200px 500px at 10% -10%, rgba(79, 70, 229, .22) 0%, transparent 60%),
                   radial-gradient(900px 400px at 110% 0%, rgba(219, 39, 119, .14) 0%, transparent 55%);
        --surface: #151826;
        --surface-2: #1b1f30;
        --text: #eceef7;
        --muted: #9096ad;
        --border: #262a3d;
        --accent: #818cf8;
        --accent-2: #a78bfa;
        --accent-soft: rgba(129, 140, 248, .14);
        --danger: #fb7185;
        --danger-soft: rgba(251, 113, 133, .12);
        --success: #34d399;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px -8px rgba(0, 0, 0, .5);
        --shadow-lg: 0 24px 48px -12px rgba(0, 0, 0, .7);
        --avatar-l: 24%;
        --avatar-text-l: 80%;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-grad), var(--bg);
      background-attachment: fixed;
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    svg { flex-shrink: 0; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 20px 96px; }

    /* ---------- En-tête ---------- */
    .topbar {
      display: flex; align-items: center; gap: 14px;
      padding: 28px 0 20px;
    }
    .logo {
      width: 44px; height: 44px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; box-shadow: 0 8px 20px -6px rgba(79, 70, 229, .55);
    }
    .brand h1 { margin: 0; font-size: 1.45rem; letter-spacing: -.02em; }
    .brand p { margin: 0; color: var(--muted); font-size: .92rem; }

    /* ---------- Statistiques ---------- */
    .stats {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin-bottom: 24px;
    }
    .stat {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 14px; min-width: 0;
    }
    .stat-icon {
      width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
    }
    .stat-value { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.2; }
    .stat-label { color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat > div:last-child { min-width: 0; }

    /* ---------- Mise en page ---------- */
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
    .panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
    }

    /* ---------- Formulaire ---------- */
    .form-panel { position: sticky; top: 20px; padding: 22px; transition: border-color .2s, box-shadow .2s; }
    .form-panel.editing { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
    .panel-title { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 1.05rem; }
    .panel-title .dot {
      width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent);
    }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; }
    label .req { color: var(--danger); }
    .input-wrap { position: relative; }
    .input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    input, textarea, select {
      width: 100%; font: inherit; font-size: 16px; /* 16px évite le zoom auto sur iOS */
      color: var(--text); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 11px 13px; transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .input-wrap input { padding-left: 38px; }
    textarea { resize: vertical; min-height: 96px; }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--accent); background: var(--surface);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .char-count { text-align: right; font-size: .75rem; color: var(--muted); margin-top: 4px; }

    .btn {
      font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border-radius: var(--radius-sm); border: 1px solid transparent;
      padding: 11px 16px; transition: transform .08s, background .15s, border-color .15s, color .15s, opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn-primary { width: 100%; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 18px -8px rgba(79, 70, 229, .7); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { width: 100%; margin-top: 8px; background: transparent; color: var(--muted); border-color: var(--border); }
    .btn-ghost:hover { color: var(--text); background: var(--surface-2); }
    .icon-btn {
      width: 40px; height: 40px; padding: 0; border-radius: var(--radius-sm);
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    }
    .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- Liste ---------- */
    .list-panel { padding: 20px; min-width: 0; }
    .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar .input-wrap { flex: 1 1 220px; }
    .toolbar select { width: auto; flex: 0 0 auto; padding-right: 30px; cursor: pointer; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
    .contact {
      position: relative; display: flex; flex-direction: column; gap: 12px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px; min-width: 0;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      animation: pop .25s ease both;
    }
    .contact:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
    .contact.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } }

    .contact-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; flex: 0 0 44px;
      display: grid; place-items: center; font-weight: 700; font-size: 1rem;
      background: hsl(var(--h) 70% var(--avatar-l)); color: hsl(var(--h) 60% var(--avatar-text-l));
    }
    .who { min-width: 0; }
    .name { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .email {
      display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
      color: var(--accent); font-size: .85rem; text-decoration: none;
    }
    .email span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .email:hover span { text-decoration: underline; }
    .message {
      margin: 0; color: var(--text); opacity: .85; font-size: .92rem;
      white-space: pre-wrap; word-break: break-word;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .message.empty { color: var(--muted); font-style: italic; opacity: 1; }
    .contact-foot {
      margin-top: auto; padding-top: 12px; border-top: 1px dashed var(--border);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .date { color: var(--muted); font-size: .78rem; display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
    .actions { display: flex; gap: 6px; }
    .act {
      width: 34px; height: 34px; padding: 0; border-radius: 9px;
      background: transparent; border: 1px solid var(--border); color: var(--muted);
    }
    .act-edit:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
    .act-del:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }

    /* ---------- États ---------- */
    .state { text-align: center; padding: 48px 16px; color: var(--muted); }
    .state svg { color: var(--accent); opacity: .85; margin-bottom: 10px; }
    .state h3 { margin: 0 0 4px; color: var(--text); font-size: 1.05rem; }
    .state p { margin: 0; font-size: .9rem; }
    .state.error svg { color: var(--danger); }
    .skeleton { height: 150px; border-radius: 14px; border: 1px solid var(--border);
      background: linear-gradient(90deg, var(--surface-2) 0%, var(--border) 50%, var(--surface-2) 100%);
      background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
      display: flex; align-items: center; gap: 10px;
      background: var(--text); color: var(--bg); padding: 12px 18px; border-radius: 12px;
      font-size: .9rem; font-weight: 500; box-shadow: var(--shadow-lg);
      transition: all .25s ease; max-width: calc(100% - 32px); z-index: 50;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--danger); color: #fff; }

    /* ---------- Modale de confirmation ---------- */
    dialog {
      border: 1px solid var(--border); border-radius: 18px; padding: 24px;
      background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg);
      width: min(400px, calc(100% - 32px));
    }
    dialog::backdrop { background: rgba(10, 12, 24, .45); backdrop-filter: blur(3px); }
    dialog[open] { animation: pop .2s ease; }
    .dialog-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--danger-soft); color: var(--danger); margin-bottom: 14px; }
    dialog h3 { margin: 0 0 6px; font-size: 1.1rem; }
    dialog p { margin: 0 0 20px; color: var(--muted); font-size: .92rem; }
    .dialog-actions { display: flex; gap: 10px; justify-content: flex-end; }
    .dialog-actions .btn { width: auto; margin: 0; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { filter: brightness(1.08); }

    /* ---------- Bouton flottant (mobile) ---------- */
    .fab {
      display: none; position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom));
      width: 56px; height: 56px; border-radius: 18px; border: none; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
      box-shadow: 0 14px 28px -8px rgba(79, 70, 229, .7); z-index: 40;
      place-items: center;
    }

    footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 32px; }

    /* ---------- Responsive ---------- */
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .form-panel { position: static; order: 2; } /* la liste passe en premier */
      .list-panel { order: 1; }
    }
    @media (max-width: 640px) {
      .container { padding: 0 16px 110px; }
      .topbar { padding: 20px 0 16px; }
      .brand h1 { font-size: 1.25rem; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
      .stat { flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; }
      .stat-icon { width: 32px; height: 32px; }
      .stat-icon svg { width: 16px; height: 16px; }
      .stat-value { font-size: 1.15rem; }
      #stat-last { font-size: .9rem; }
      .stat-label { font-size: .74rem; }
      .form-panel, .list-panel { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
      .toolbar select { flex: 1 1 auto; }
      .act { width: 40px; height: 40px; } /* cibles tactiles plus grandes */
      .fab { display: grid; }
      .fab.hidden { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <!-- Icônes réutilisables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 15c2 .6 3.2 2.2 3.5 5"/></symbol>
      <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17.5v.01"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    </defs>
  </svg>

  <div class="container">
    <header class="topbar">
      <div class="logo"><svg width="24" height="24"><use href="#i-users"/></svg></div>
      <div class="brand">
        <h1>Carnet de contacts</h1>
        <p>Serverless sur AWS · API Gateway · Lambda · DynamoDB</p>
      </div>
    </header>

    <section class="stats" aria-label="Statistiques">
      <div class="stat">
        <div class="stat-icon"><svg width="20" height="20"><use href="#i-users"/></svg></div>
        <div><div class="stat-value" id="stat-total">–</div><div class="stat-label">Contacts</div></div>
      </div>
      <div class="stat">
        <div class="stat-icon"><svg width="20" height="20"><use href="#i-spark"/></svg></div>
        <div><div class="stat-value" id="stat-week">–</div><div class="stat-label">Ajoutés (7 j)</div></div>
      </div>
      <div class="stat">
        <div class="stat-icon"><svg width="20" height="20"><use href="#i-clock"/></svg></div>
        <div><div class="stat-value" id="stat-last">–</div><div class="stat-label">Dernier ajout</div></div>
      </div>
    </section>

    <main class="layout">
      <!-- Formulaire -->
      <section class="panel form-panel" id="form-card" aria-labelledby="form-title">
        <h2 class="panel-title">
          <span class="dot"><svg width="16" height="16" id="form-icon"><use href="#i-plus"/></svg></span>
          <span id="form-title">Nouveau contact</span>
        </h2>
        <form id="contact-form" novalidate>
          <div class="field">
            <label for="nom">Nom <span class="req">*</span></label>
            <div class="input-wrap">
              <svg width="18" height="18"><use href="#i-user"/></svg>
              <input id="nom" name="nom" type="text" maxlength="100" autocomplete="name" required placeholder="Alice Martin">
            </div>
          </div>
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <div class="input-wrap">
              <svg width="18" height="18"><use href="#i-mail"/></svg>
              <input id="email" name="email" type="email" maxlength="200" autocomplete="email" inputmode="email" required placeholder="alice@example.com">
            </div>
          </div>
          <div class="field">
            <label for="message">Message</label>
            <textarea id="message" name="message" maxlength="1000" placeholder="Un petit mot…"></textarea>
            <div class="char-count"><span id="char-count">0</span> / 1000</div>
          </div>
          <button type="submit" class="btn btn-primary" id="submit-btn">
            <svg width="18" height="18"><use href="#i-plus"/></svg><span>Ajouter le contact</span>
          </button>
          <button type="button" class="btn btn-ghost" id="cancel-btn" hidden>Annuler</button>
        </form>
      </section>

      <!-- Liste -->
      <section class="panel list-panel" aria-label="Liste des contacts">
        <div class="toolbar">
          <div class="input-wrap">
            <svg width="18" height="18"><use href="#i-search"/></svg>
            <input id="search" type="search" placeholder="Rechercher un nom, un email…" aria-label="Rechercher">
          </div>
          <select id="sort" aria-label="Trier">
            <option value="recent">Plus récents</option>
            <option value="oldest">Plus anciens</option>
            <option value="az">Nom A → Z</option>
            <option value="za">Nom Z → A</option>
          </select>
          <button class="btn icon-btn" id="refresh-btn" title="Actualiser" aria-label="Actualiser">
            <svg width="18" height="18" id="refresh-icon"><use href="#i-refresh"/></svg>
          </button>
        </div>
        <div id="list" aria-live="polite"></div>
      </section>
    </main>

    <footer>Projet perso · S3 + CloudFront · API Gateway · Lambda (Python) · DynamoDB</footer>
  </div>

  <!-- Bouton flottant mobile -->
  <button class="fab" id="fab" aria-label="Ajouter un contact"><svg width="24" height="24"><use href="#i-plus"/></svg></button>

  <!-- Modale de confirmation de suppression -->
  <dialog id="confirm-dialog">
    <div class="dialog-icon"><svg width="22" height="22"><use href="#i-trash"/></svg></div>
    <h3>Supprimer ce contact ?</h3>
    <p id="confirm-text">Cette action est définitive.</p>
    <div class="dialog-actions">
      <button class="btn btn-ghost" id="confirm-cancel">Annuler</button>
      <button class="btn btn-danger" id="confirm-ok">Supprimer</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <script>
    // ⚙️ CONFIGURATION : ton Invoke URL API Gateway (sans "/" à la fin)
    const API_URL = "https://25tr6bt5ki.execute-api.eu-north-1.amazonaws.com/dev";

    let contacts = [];
    let editingId = null; // null = mode ajout

    const $ = (id) => document.getElementById(id);
    const form = $("contact-form");
    const list = $("list");
    const search = $("search");
    const sortSel = $("sort");

    // ---------- Utilitaires ----------
    // Échappe le HTML pour éviter l'exécution de code injecté (XSS)
    function esc(str) {
      return String(str ?? "").replace(/[&<>"']/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
    }

    // Couleur d'avatar stable dérivée du nom
    function hue(str) {
      let h = 0;
      for (const ch of String(str || "?")) h = (h * 31 + ch.codePointAt(0)) % 360;
      return h;
    }

    function initials(nom) {
      const parts = String(nom || "?").trim().split(/\s+/).filter(Boolean);
      return ((parts[0]?.[0] || "?") + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
    }

    const rtf = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });
    function relativeDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d)) return "";
      const sec = Math.round((d - Date.now()) / 1000);
      const abs = Math.abs(sec);
      if (abs < 60) return "à l'instant";
      if (abs < 3600) return rtf.format(Math.round(sec / 60), "minute");
      if (abs < 86400) return rtf.format(Math.round(sec / 3600), "hour");
      if (abs < 7 * 86400) return rtf.format(Math.round(sec / 86400), "day");
      return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
    }

    function toast(msg, isError = false) {
      const t = $("toast");
      t.innerHTML = `<svg width="18" height="18"><use href="#${isError ? "i-alert" : "i-check"}"/></svg><span>${esc(msg)}</span>`;
      t.className = "toast show" + (isError ? " error" : "");
      clearTimeout(t._timer);
      t._timer = setTimeout(() => (t.className = "toast" + (isError ? " error" : "")), 3200);
    }

    // ---------- API ----------
    async function api(path, options = {}) {
      const res = await fetch(API_URL + path, {
        ...options,
        headers: options.body ? { "Content-Type": "application/json" } : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `Erreur ${res.status}`);
      return data;
    }

    // ---------- Chargement ----------
    async function loadContacts() {
      $("refresh-icon").classList.add("spin");
      if (!contacts.length) list.innerHTML = `<div class="grid">${'<div class="skeleton"></div>'.repeat(4)}</div>`;
      try {
        contacts = await api("/contacts");
        render();
      } catch (err) {
        list.innerHTML = `
          <div class="state error">
            <svg width="44" height="44"><use href="#i-alert"/></svg>
            <h3>Impossible de charger les contacts</h3>
            <p>${esc(err.message)}<br>Vérifie l'URL de l'API et la configuration CORS.</p>
          </div>`;
      } finally {
        $("refresh-icon").classList.remove("spin");
      }
    }

    // ---------- Statistiques ----------
    function renderStats() {
      $("stat-total").textContent = contacts.length;
      const weekAgo = Date.now() - 7 * 86400 * 1000;
      $("stat-week").textContent = contacts.filter((c) => new Date(c.createdAt) > weekAgo).length;
      const last = contacts.map((c) => c.createdAt).filter(Boolean).sort().pop();
      $("stat-last").textContent = last ? relativeDate(last) : "–";
    }

    // ---------- Affichage ----------
    function sorted(arr) {
      const byName = (a, b) => String(a.nom || "").localeCompare(String(b.nom || ""), "fr", { sensitivity: "base" });
      const byDate = (a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
      switch (sortSel.value) {
        case "oldest": return [...arr].sort(byDate);
        case "az": return [...arr].sort(byName);
        case "za": return [...arr].sort((a, b) => byName(b, a));
        default: return [...arr].sort((a, b) => byDate(b, a));
      }
    }

    function render() {
      renderStats();
      const q = search.value.trim().toLowerCase();
      const filtered = sorted(contacts).filter((c) =>
        [c.nom, c.email, c.message].some((v) => String(v ?? "").toLowerCase().includes(q)));

      if (!contacts.length) {
        list.innerHTML = `
          <div class="state">
            <svg width="48" height="48"><use href="#i-users"/></svg>
            <h3>Aucun contact pour l'instant</h3>
            <p>Ajoute ton premier contact avec le formulaire.</p>
          </div>`;
        return;
      }
      if (!filtered.length) {
        list.innerHTML = `
          <div class="state">
            <svg width="44" height="44"><use href="#i-search"/></svg>
            <h3>Aucun résultat</h3>
            <p>Aucun contact ne correspond à « ${esc(search.value.trim())} ».</p>
          </div>`;
        return;
      }

      list.innerHTML = `<div class="grid">${filtered.map((c) => `
        <article class="contact${c.id === editingId ? " editing" : ""}">
          <div class="contact-head">
            <div class="avatar" style="--h:${hue(c.nom)}">${esc(initials(c.nom))}</div>
            <div class="who">
              <div class="name" title="${esc(c.nom)}">${esc(c.nom || "Sans nom")}</div>
              ${c.email ? `<a class="email" href="mailto:${esc(c.email)}"><svg width="14" height="14"><use href="#i-mail"/></svg><span>${esc(c.email)}</span></a>` : ""}
            </div>
          </div>
          ${c.message
            ? `<p class="message">${esc(c.message)}</p>`
            : `<p class="message empty">Pas de message</p>`}
          <div class="contact-foot">
            <span class="date" title="${esc(c.createdAt ? new Date(c.createdAt).toLocaleString("fr-FR") : "")}">
              <svg width="13" height="13"><use href="#i-clock"/></svg>${esc(relativeDate(c.createdAt))}${c.updatedAt ? " · modifié" : ""}
            </span>
            <div class="actions">
              <button class="btn act act-edit" data-action="edit" data-id="${esc(c.id)}" title="Modifier" aria-label="Modifier ${esc(c.nom)}"><svg width="16" height="16"><use href="#i-edit"/></svg></button>
              <button class="btn act act-del" data-action="delete" data-id="${esc(c.id)}" title="Supprimer" aria-label="Supprimer ${esc(c.nom)}"><svg width="16" height="16"><use href="#i-trash"/></svg></button>
            </div>
          </div>
        </article>`).join("")}</div>`;
    }

    // ---------- Mode ajout / modification ----------
    function setSubmitLabel(text, icon) {
      $("submit-btn").innerHTML = `<svg width="18" height="18"><use href="#${icon}"/></svg><span>${text}</span>`;
    }

    function focusForm() {
      $("form-card").scrollIntoView({ behavior: "smooth", block: "start" });
      setTimeout(() => form.nom.focus({ preventScroll: true }), 300);
    }

    function startEdit(id) {
      const c = contacts.find((x) => x.id === id);
      if (!c) return;
      editingId = id;
      form.nom.value = c.nom || "";
      form.email.value = c.email || "";
      form.message.value = c.message || "";
      updateCharCount();
      $("form-title").textContent = "Modifier le contact";
      $("form-icon").innerHTML = '<use href="#i-edit"/>';
      setSubmitLabel("Enregistrer", "i-check");
      $("cancel-btn").hidden = false;
      $("form-card").classList.add("editing");
      render();
      focusForm();
    }

    function stopEdit() {
      editingId = null;
      form.reset();
      updateCharCount();
      $("form-title").textContent = "Nouveau contact";
      $("form-icon").innerHTML = '<use href="#i-plus"/>';
      setSubmitLabel("Ajouter le contact", "i-plus");
      $("cancel-btn").hidden = true;
      $("form-card").classList.remove("editing");
      render();
    }

    function updateCharCount() {
      $("char-count").textContent = form.message.value.length;
    }

    // ---------- Envoi du formulaire : POST ou PUT ----------
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const nom = form.nom.value.trim();
      const email = form.email.value.trim();
      const message = form.message.value.trim();

      if (!nom) { form.nom.focus(); return toast("Le nom est obligatoire.", true); }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { form.email.focus(); return toast("Adresse email invalide.", true); }

      const btn = $("submit-btn");
      const isEdit = editingId !== null;
      btn.disabled = true;
      setSubmitLabel(isEdit ? "Enregistrement…" : "Ajout…", "i-refresh");
      btn.querySelector("svg").classList.add("spin");

      try {
        if (isEdit) {
          const updated = await api(`/contacts/${encodeURIComponent(editingId)}`, {
            method: "PUT",
            body: JSON.stringify({ nom, email, message }),
          });
          contacts = contacts.map((c) => (c.id === updated.id ? updated : c));
          stopEdit();
          toast(`${nom} a été modifié(e).`);
        } else {
          const created = await api("/contacts", {
            method: "POST",
            body: JSON.stringify({ nom, email, message }),
          });
          contacts.push(created);
          form.reset();
          updateCharCount();
          render();
          toast(`${nom} a été ajouté(e).`);
        }
      } catch (err) {
        toast((isEdit ? "Échec de la modification : " : "Échec de l'ajout : ") + err.message, true);
        setSubmitLabel(isEdit ? "Enregistrer" : "Ajouter le contact", isEdit ? "i-check" : "i-plus");
      } finally {
        btn.disabled = false;
      }
    });

    // ---------- Suppression avec modale ----------
    const dialog = $("confirm-dialog");
    function confirmDelete(nom) {
      $("confirm-text").textContent = `${nom || "Ce contact"} sera définitivement supprimé(e).`;
      dialog.showModal();
      return new Promise((resolve) => {
        const done = (ok) => { dialog.close(); cleanup(); resolve(ok); };
        const onOk = () => done(true);
        const onCancel = () => done(false);
        const onBackdrop = (e) => { if (e.target === dialog) done(false); };
        const onClose = () => { cleanup(); resolve(false); };
        function cleanup() {
          $("confirm-ok").removeEventListener("click", onOk);
          $("confirm-cancel").removeEventListener("click", onCancel);
          dialog.removeEventListener("click", onBackdrop);
          dialog.removeEventListener("close", onClose);
        }
        $("confirm-ok").addEventListener("click", onOk);
        $("confirm-cancel").addEventListener("click", onCancel);
        dialog.addEventListener("click", onBackdrop);
        dialog.addEventListener("close", onClose);
      });
    }

    async function deleteContact(id, btn) {
      const c = contacts.find((x) => x.id === id);
      if (!(await confirmDelete(c?.nom))) return;
      btn.disabled = true;
      try {
        await api(`/contacts/${encodeURIComponent(id)}`, { method: "DELETE" });
        contacts = contacts.filter((x) => x.id !== id);
        if (editingId === id) stopEdit(); else render();
        toast("Contact supprimé.");
      } catch (err) {
        btn.disabled = false;
        toast("Échec de la suppression : " + err.message, true);
      }
    }

    // ---------- Événements ----------
    list.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      if (btn.dataset.action === "edit") startEdit(btn.dataset.id);
      if (btn.dataset.action === "delete") deleteContact(btn.dataset.id, btn);
    });
    $("cancel-btn").addEventListener("click", stopEdit);
    $("refresh-btn").addEventListener("click", loadContacts);
    $("fab").addEventListener("click", () => { if (editingId) stopEdit(); focusForm(); });
    search.addEventListener("input", render);
    sortSel.addEventListener("change", render);
    form.message.addEventListener("input", updateCharCount);

    // Cache le bouton flottant quand le formulaire est visible
    new IntersectionObserver(([entry]) => $("fab").classList.toggle("hidden", entry.isIntersecting))
      .observe($("form-card"));

    loadContacts();
  </script>
</body>
</html>
